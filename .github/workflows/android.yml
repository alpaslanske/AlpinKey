name: Android Release CI/CD

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java Ortamını Kur (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Keystore Dosyasını Çöz ve Oluştur
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n' | base64 -d > "${{ github.workspace }}/app/release-keystore.jks"

    - name: Gradle'a Çalıştırma İzni Ver
      run: chmod +x gradlew

    - name: İmzalı Release APK Derle
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file="${{ github.workspace }}/app/release-keystore.jks" \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: APK Dosyasını Yeniden Adlandır
      id: rename_apk
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          VERSION_TAG="${{ github.event.release.tag_name }}"
        else
          VERSION_TAG="${{ github.ref_name }}"
        fi

        NEW_NAME="alpinKey-${VERSION_TAG}-release.apk"

        mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$NEW_NAME"
        echo "apk_path=app/build/outputs/apk/release/$NEW_NAME" >> $GITHUB_OUTPUT
        echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

    - name: Oluşan APK Dosyasını Yükle (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: ${{ steps.rename_apk.outputs.apk_path }}
        retention-days: 7

    - name: GitHub Release Olarak Yayınla
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.rename_apk.outputs.version_tag }}
        REPO: ${{ github.repository }}
      run: |
        RELEASE_ID=$(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG_NAME\") | .id" | head -n 1)

        if [ -z "$RELEASE_ID" ]; then
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG_NAME" \
            -f name="$TAG_NAME" \
            -F draft=false \
            -F generate_release_notes=true >/dev/null
        fi

        gh release upload "$TAG_NAME" "${{ steps.rename_apk.outputs.apk_path }}" --clobber
